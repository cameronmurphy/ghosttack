name: Build
run-name: >-
  Build ${{ github.event.workflow_run.head_branch || github.ref_name }}${{
  github.event.workflow_run.display_title && format(' ({0})', github.event.workflow_run.display_title) || '' }}

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Lint and test']
    types: [completed]

jobs:
  build:
    if: >-
      ${{ !github.event.workflow_run
      || (github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.head_branch == 'main'
      || startsWith(github.event.workflow_run.head_branch, 'v'))) }}
    runs-on: macos-latest

    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install
        uses: ./.github/actions/install

      - name: Build
        run: |
          deno compile --allow-read --allow-write --allow-run --allow-env \
            --allow-net=api.github.com,github.com,release-assets.githubusercontent.com,objects.githubusercontent.com \
            --target ${{ matrix.target }} --output dist/ghosttack-${{ matrix.target }} main.ts

      - name: Upload compiled app
        uses: actions/upload-artifact@v7
        with:
          name: ghosttack-${{ matrix.target }}
          path: dist/ghosttack-${{ matrix.target }}

  release:
    if: startsWith(github.event.workflow_run.head_branch, 'v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download compiled apps
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksum the binaries
        working-directory: dist
        run: sha256sum ghosttack-* > SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$TAG" dist/ghosttack-* dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    if: startsWith(github.event.workflow_run.head_branch, 'v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install
        uses: ./.github/actions/install

      - name: Publish to JSR
        run: deno publish
