name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # Every path into this workflow lints and tests first, so a tag can't build or release what main
  # wouldn't. Waiting on the separate run of Lint and test only covers pushes to main; a tag pushed
  # at the same time would race past it.
  verify:
    uses: ./.github/workflows/lint-and-test.yml

  build:
    needs: verify
    runs-on: macos-latest

    # macOS only. ghosttack builds tabs and splits through Ghostty's AppleScript dictionary, which
    # exists nowhere else, so a Linux or Windows binary would compile and then refuse to run.
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Build
        run: |
          deno compile --allow-read --allow-write --allow-run --allow-env \
            --target ${{ matrix.target }} --output dist/ghosttack-${{ matrix.target }} main.ts

      - name: Upload compiled app
        uses: actions/upload-artifact@v7
        with:
          name: ghosttack-${{ matrix.target }}
          path: dist/ghosttack-${{ matrix.target }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download compiled apps
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Tags can already have a release (they get one when publishing to JSR), and a run can be
      # repeated, so create only when missing and let the upload overwrite.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/ghosttack-* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Publish to JSR
        run: deno publish
